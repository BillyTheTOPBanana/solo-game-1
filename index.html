<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    
    <title>Word Wonk</title>
</head>
<body>
    <div class="centering">
        <div id="debug-print"></div>
    </div>
    <h1 id="game-title">Word Wonk<br>for <span class="todays-date">____-__-__</span></h1>
    <div class="centering">
        <div class="position-relative">
            <div id="letter-container"></div>
            <div hidden="" class="wonk-effect">WONK</div>
        </div>
    </div>
    <div class="centering">
        <button id="submit-word">Submit</button>
    </div>
    <div class="centering">
        <button id="backspace">Backspace</button>
    </div>
    <div class="centering">
        <button id="clear-word">Clear</button>
    </div>
    <div class="centering">
        <div id="typing-area"></div>
    </div>
    <div class="centering">
        <div id="word-list-container">
            <h2>Used words:</h2>
            <ul role="list"></ul>
        </div>
    </div>
</body>
</html>
